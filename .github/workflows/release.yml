name: Build & Release (Multi-Platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  #  Матрица сборки: Windows · macOS · Linux
  # ═══════════════════════════════════════════════════════════════════════
  build:
    strategy:
      fail-fast: false       # Не останавливаем остальные если одна платформа упала
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            artifact_ext: exe

          - os: macos-15       # Apple Silicon (M1/M2/M3/M4)
            platform: macos
            arch: arm64
            artifact_ext: dmg

          - os: macos-15-intel # Intel Mac
            platform: macos
            arch: x64
            artifact_ext: dmg

          - os: ubuntu-22.04
            platform: linux
            arch: x64
            artifact_ext: AppImage

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      # ── Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── Системные зависимости Linux ───────────────────────────────────
      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 portaudio19-dev \
            libasound2-dev \
            libgl1-mesa-glx libglib2.0-0 \
            libxcb-xinerama0 libxcb-cursor0 \
            tesseract-ocr \
            fuse libfuse2

      # ── Системные зависимости macOS ───────────────────────────────────
      - name: Install macOS system deps
        if: matrix.platform == 'macos'
        run: |
          brew install portaudio tesseract || true

      # ── Python зависимости ────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-build.txt — только то что нужно PyInstaller'у.
          # openai-whisper/torch/llvmlite НЕ ставим в CI — они исключены
          # из бандла (см. LessonRecorder.spec excludes) и устанавливаются
          # пользователем при первом запуске приложения.
          pip install -r requirements-build.txt
          pip install pyinstaller packaging

      - name: Install Windows-only packages
        if: matrix.platform == 'windows'
        # PyAudioWPatch — WASAPI loopback, только Windows
        run: pip install PyAudioWPatch

      # ── Версия ────────────────────────────────────────────────────────
      - name: Read version
        id: version
        shell: bash
        run: |
          VER=$(python -c "from version import __version__; print(__version__)")
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      # ── Changelog ─────────────────────────────────────────────────────
      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          else
            NOTES="_Описание изменений не предоставлено._"
          fi
          DELIMITER="NOTES_EOF_$(date +%s)"
          {
            echo "BODY<<$DELIMITER"
            echo "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      # ── PyInstaller ───────────────────────────────────────────────────
      - name: Build with PyInstaller (Windows)
        if: matrix.platform == 'windows'
        run: pyinstaller LessonRecorder.spec --clean --noconfirm

      - name: Build with PyInstaller (macOS/Linux)
        if: matrix.platform != 'windows'
        run: pyinstaller LessonRecorder.spec --clean --noconfirm

      # ═══ Windows: Inno Setup installer ════════════════════════════════
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          iscc installer\setup.iss
          $src = Get-ChildItem "dist\installer\*.exe" | Select-Object -First 1
          if ($src) {
            $name = "LessonRecorder_v${{ steps.version.outputs.VERSION }}_Windows_x64_setup.exe"
            $dst  = Join-Path $src.DirectoryName $name
            if ($src.FullName -ne $dst) { Rename-Item $src.FullName $name -Force }
          }

      # ═══ macOS: освобождаем место на диске ══════════════════════════
      - name: Free disk space (macOS)
        if: matrix.platform == 'macos'
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          # Агрессивная очистка — освобождаем 10-20 ГБ
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchOS.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/WatchSimulator.platform || true
          sudo rm -rf /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTVSimulator.platform || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf ~/Library/Caches/Homebrew || true
          brew cleanup --prune=all 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h /

      # ═══ macOS: .zip вместо DMG (нет проблем с диском) ═══════════════
      - name: Build macOS ZIP
        if: matrix.platform == 'macos'
        run: |
          APP="dist/LessonRecorder.app"
          ARCH="${{ matrix.arch }}"
          VER="${{ steps.version.outputs.VERSION }}"
          ZIP="dist/LessonRecorder_v${VER}_macOS_${ARCH}.zip"

          echo "App size: $(du -sh "$APP" | awk '{print $1}')"
          echo "Free disk: $(df -h / | awk 'NR==2{print $4}')"

          # Упаковываем в zip — не требует доп. дискового пространства
          cd dist
          zip -r --symlinks "../${ZIP}" LessonRecorder.app
          cd ..

          echo "ZIP size: $(du -sh "$ZIP" | awk '{print $1}')"
          echo "DMG_PATH=${ZIP}" >> "$GITHUB_ENV"

      # ═══ Linux: AppImage + tar.gz ═════════════════════════════════════
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          VER="${{ steps.version.outputs.VERSION }}"

          # Скачиваем appimagetool
          curl -L "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
               -o dist/appimagetool
          chmod +x dist/appimagetool

          # AppDir
          APPDIR="dist/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r dist/LessonRecorder/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/LessonRecorder.desktop" <<'EOF'
          [Desktop Entry]
          Name=LessonRecorder
          Exec=LessonRecorder
          Icon=LessonRecorder
          Type=Application
          Categories=Education;AudioVideo;
          EOF

          cp "$APPDIR/LessonRecorder.desktop" \
             "$APPDIR/usr/share/applications/LessonRecorder.desktop"

          # Иконка — используем app_icon.png или создаём placeholder
          if [[ -f app_icon.png ]]; then
            cp app_icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/LessonRecorder.png"
            cp app_icon.png "$APPDIR/LessonRecorder.png"
          else
            python3 -c "import struct,zlib; sig=b'\x89PNG\r\n\x1a\n'; \
              d=b'\x00\xff\xff\xff'; cd=zlib.compress(d); \
              ih=b'IHDR'+struct.pack('>IIBBBBB',1,1,8,2,0,0,0); \
              open('icon.png','wb').write(sig + struct.pack('>I',13)+ih+struct.pack('>I',zlib.crc32(ih)&0xffffffff) + struct.pack('>I',len(cd))+b'IDAT'+cd+struct.pack('>I',zlib.crc32(b'IDAT'+cd)&0xffffffff) + struct.pack('>I',0)+b'IEND'+struct.pack('>I',zlib.crc32(b'IEND')&0xffffffff))"
            cp icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/LessonRecorder.png"
            cp icon.png "$APPDIR/LessonRecorder.png"
          fi

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/LessonRecorder" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          APPIMAGE="dist/LessonRecorder_v${VER}_Linux_x64.AppImage"
          ARCH=x86_64 dist/appimagetool "$APPDIR" "$APPIMAGE"
          chmod +x "$APPIMAGE"

          # tar.gz как запасной вариант
          tar -czf "dist/LessonRecorder_v${VER}_Linux_x64.tar.gz" \
              -C dist LessonRecorder

          echo "APPIMAGE_PATH=$APPIMAGE" >> "$GITHUB_ENV"
          echo "TAR_PATH=dist/LessonRecorder_v${VER}_Linux_x64.tar.gz" >> "$GITHUB_ENV"

      # ── Находим итоговый артефакт ──────────────────────────────────────
      - name: Find artifact (Windows)
        if: matrix.platform == 'windows'
        id: artifact_win
        shell: pwsh
        run: |
          $f = Get-ChildItem "dist\installer\*.exe" | Select-Object -First 1
          echo "PATH=$($f.FullName)" >> $env:GITHUB_OUTPUT
          echo "NAME=$($f.Name)"     >> $env:GITHUB_OUTPUT

      - name: Find artifact (macOS)
        if: matrix.platform == 'macos'
        id: artifact_mac
        shell: bash
        run: |
          # Ищем zip или dmg, используем find чтобы не падать если файла нет
          f=$(find dist -maxdepth 1 \( -name "*.zip" -o -name "*.dmg" \) | head -1)
          if [[ -z "$f" ]]; then
            echo "ERROR: no .zip or .dmg found in dist/"
            ls -la dist/
            exit 1
          fi
          echo "PATH=$f"             >> "$GITHUB_OUTPUT"
          echo "NAME=$(basename $f)" >> "$GITHUB_OUTPUT"
          echo "Found: $f"

      - name: Find artifact (Linux)
        if: matrix.platform == 'linux'
        id: artifact_linux
        shell: bash
        run: |
          fi=$(ls dist/*.AppImage | head -1)
          ft=$(ls dist/*.tar.gz | head -1)
          echo "APPIMAGE_PATH=$fi"           >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_NAME=$(basename $fi)" >> "$GITHUB_OUTPUT"
          echo "TAR_PATH=$ft"               >> "$GITHUB_OUTPUT"
          echo "TAR_NAME=$(basename $ft)"   >> "$GITHUB_OUTPUT"

      # ── Upload artifact для последующего релиза ───────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/installer/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════════════
  #  Создание GitHub Release (после всех сборок)
  # ═══════════════════════════════════════════════════════════════════════
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(python3 -c "from version import __version__; print(__version__)")
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Read changelog
        id: changelog
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then NOTES=$(cat RELEASE_NOTES.md)
          else NOTES="_Описание изменений не предоставлено._"; fi
          DELIM="NOTES_EOF_$(date +%s)"
          { echo "BODY<<$DELIM"; echo "$NOTES"; echo "$DELIM"; } >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LessonRecorder v${{ steps.version.outputs.VERSION }}"
          body: |
            ${{ steps.changelog.outputs.BODY }}

            ---

            ## 📦 Скачать

            | Платформа | Файл |
            |-----------|------|
            | 🪟 Windows 10/11 (64-bit) | `LessonRecorder_v..._Windows_x64_setup.exe` |
            | 🍎 macOS (Apple Silicon M1/M2/M3/M4) | `LessonRecorder_v..._macOS_arm64.zip` |
            | 🍎 macOS (Intel) | `LessonRecorder_v..._macOS_x64.zip` |
            | 🐧 Linux (x64) AppImage | `LessonRecorder_v..._Linux_x64.AppImage` |
            | 🐧 Linux (x64) tar.gz | `LessonRecorder_v..._Linux_x64.tar.gz` |

            ## 🚀 Установка

            **Windows:** Запустите `.exe` установщик — Python установится автоматически.

            **macOS:** Откройте `.dmg`, перетащите в `/Applications`. При первом запуске:
            ```
            Правой кнопкой → Открыть → Открыть (обойти Gatekeeper)
            ```
            Если Python не установлен: `brew install python3`

            **Linux (AppImage):**
            ```bash
            chmod +x LessonRecorder_*.AppImage
            ./LessonRecorder_*.AppImage
            ```
            Если Python не установлен: `sudo apt install python3.12` (Ubuntu/Debian)

            ## Системные требования

            - Python 3.10+ (Windows — устанавливается автоматически)
            - 4 GB RAM (8 GB рекомендуется для Whisper)
            - Интернет при первой установке
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}