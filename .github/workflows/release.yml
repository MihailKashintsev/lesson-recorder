name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller packaging
      - name: Build with PyInstaller
        run: pyinstaller LessonRecorder.spec --clean --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          iscc installer\setup.iss
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $src = Get-ChildItem "dist\installer\*.exe" | Select-Object -First 1
          if ($src) {
            $dstName = "LessonRecorder_v${ver}_Windows_x64_setup.exe"
            Rename-Item -Path $src.FullName -NewName $dstName -Force
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe
          retention-days: 1

  # ── macOS ARM64 (Apple Silicon) ───────────────────────────────────────────
  build-macos-arm:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller packaging
      - name: Build with PyInstaller
        run: pyinstaller LessonRecorder.spec --clean --noconfirm
      - name: Ad-hoc code sign (required for arm64 to launch at all)
        run: |
          codesign --force --deep --sign - "dist/LessonRecorder.app"
          codesign --verify --deep "dist/LessonRecorder.app"
      - name: Package as zip
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          cd dist
          zip -r --symlinks "LessonRecorder_v${ver}_macOS_arm64.zip" LessonRecorder.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip
          retention-days: 1

  # ── macOS Intel (x86_64) ──────────────────────────────────────────────────
  build-macos-intel:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller packaging
      - name: Build with PyInstaller
        run: pyinstaller LessonRecorder.spec --clean --noconfirm
      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - "dist/LessonRecorder.app"
          codesign --verify --deep "dist/LessonRecorder.app"
      - name: Package as zip
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          cd dist
          zip -r --symlinks "LessonRecorder_v${ver}_macOS_x64.zip" LessonRecorder.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.zip
          retention-days: 1

  # ── Linux x64 ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libportaudio2 libpulse0 libasound2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pyinstaller packaging
      - name: Create placeholder icon if missing
        run: python3 make_icon.py
      - name: Build with PyInstaller
        run: pyinstaller LessonRecorder.spec --clean --noconfirm
      - name: Package
        run: |
          ver="${{ github.ref_name }}"
          ver="${ver#v}"
          cd dist
          tar -czf "LessonRecorder_v${ver}_Linux_x64.tar.gz" LessonRecorder/
          cp LessonRecorder/LessonRecorder "LessonRecorder_v${ver}_Linux_x64.AppImage"
          chmod +x "LessonRecorder_v${ver}_Linux_x64.AppImage"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          retention-days: 1

  # ── Publish Release ───────────────────────────────────────────────────────
  publish:
    needs: [build-windows, build-macos-arm, build-macos-intel, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: List files
        run: find release-files -type f | sort
      - name: Read changelog
        id: changelog
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            BODY=$(cat RELEASE_NOTES.md)
          else
            BODY="_Описание изменений не предоставлено._"
          fi
          EOF=$(uuidgen)
          echo "BODY<<$EOF" >> $GITHUB_OUTPUT
          echo "$BODY"      >> $GITHUB_OUTPUT
          echo "$EOF"       >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LessonRecorder ${{ github.ref_name }}"
          body: |
            ${{ steps.changelog.outputs.BODY }}

            ---

            ## 📦 Скачать

            | Платформа | Файл |
            |-----------|------|
            | 🖥 Windows 10/11 (64-bit) | `LessonRecorder_..._Windows_x64_setup.exe` |
            | 🍎 macOS Apple Silicon (M1/M2/M3/M4) | `LessonRecorder_..._macOS_arm64.zip` |
            | 🍎 macOS Intel | `LessonRecorder_..._macOS_x64.zip` |
            | 🐧 Linux AppImage | `LessonRecorder_..._Linux_x64.AppImage` |
            | 🐧 Linux tar.gz | `LessonRecorder_..._Linux_x64.tar.gz` |

            ## 🔧 Установка

            **Windows:** запустите `.exe` — Python установится автоматически.

            **macOS:** распакуйте `.zip`, перетащите в Программы. При блокировке: `xattr -cr /Applications/LessonRecorder.app`

            **Linux AppImage:** `chmod +x LessonRecorder*.AppImage && ./LessonRecorder*.AppImage`
          files: release-files/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}